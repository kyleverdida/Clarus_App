name: clarus_app
description: "Clarus mobile app — AI-assisted diabetic retinopathy referral screening"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  cross_file: ^0.3.5+4
  file_saver: ^0.2.14
  http: ^1.2.0
  image_picker: ^1.0.7
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true